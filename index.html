<!DOCTYPE html>
<!-- DTD é o Document Type Definition e informa para o
navegador a versão do HTML que está sendo carregada.
Assim o navegador pode carregar um conjunto de 
bibliotecas de acordo com a versão específica.
 -->

<!-- ATRIBUTOS:
Os atributos são do tipo chave = valor.
Ex: lang="pt-BR", isso é um atributo que pode ir em qualquer tag de 
conteúdo. <html lang="pt-BR"> ... </html>
-->

<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Página principal</title>
</head>

<body>

  <h1>Home</h1>

  <!-- Parágrafo de apresentação -->
  <p>
    Esta é a primeira página do meu site para o trabalho
    do meu querido professor Alexandre!
  </p>

  <!-- Linha temática -->
  <hr>

  <!-- Lista com tópicos -->
  <ul>
    <li>Aprender a estrutura básica do HTML</li>
    <li>Forçar o uso de tags semânticas</li>
    <li>Praticar o git</li>
  </ul>

  <!-- Links para outras páginas -->
  <div>
    <a href="pagina1.html">Página 1</a> |
    <a href="paginas/pagina2.html">Página 2</a> |
  </div>

</body>

</html>
